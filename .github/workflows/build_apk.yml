name: Build Release APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.44.7'
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.11.1'

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.7'
          cache: true

      - name: Print tool versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Accept Android SDK licenses
        run: |
          yes | flutter doctor --android-licenses > /dev/null 2>&1 || true

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Prepare Flutter local.properties
        run: |
          printf 'flutter.sdk=%s\n' "$FLUTTER_ROOT" > android/local.properties
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" >> android/local.properties

      - name: Generate Gradle Wrapper
        working-directory: android
        run: |
          gradle wrapper \
            --gradle-version=8.11.1 \
            --distribution-type=bin

      - name: Verify Gradle Wrapper
        working-directory: android
        run: |
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          ./gradlew --version

        - name: Install dependencies
        run: flutter pub get

      - name: Verify source files on Linux runner
        run: |
          echo "=== CURRENT DIRECTORY ==="
          pwd

          echo "=== LIB DIRECTORY ==="
          ls -la lib

          echo "=== LIB/SCREENS DIRECTORY ==="
          ls -lab lib/screens

          echo "=== EXACT FILE CHECK ==="
          if [ -f "lib/screens/home_screen.dart" ]; then
            echo "FOUND: lib/screens/home_screen.dart"
            wc -l "lib/screens/home_screen.dart"
            stat "lib/screens/home_screen.dart"
          else
            echo "MISSING: lib/screens/home_screen.dart"
            exit 1
          fi

          echo "=== GIT TREE ==="
          git ls-tree -r HEAD --name-only | grep -i "home_screen.dart" || true

          echo "=== MAIN IMPORT ==="
          sed -n '1,8p' lib/main.dart

      - name: Run static analysis
        run: flutter analyze --no-fatal-infos
      - name: Configure release signing
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks

            cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

            echo "Release signing configured."
          else
            echo "No release keystore configured. Using debug signing."
          fi

      - name: Build release APK
        run: |
          if [ -n "${{ secrets.GEMINI_KEY }}" ]; then
            flutter build apk --release \
              --dart-define=GEMINI_KEY="${{ secrets.GEMINI_KEY }}"
          else
            flutter build apk --release
          fi

      - name: Validate APK
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"

          test -f "$APK_PATH"

          echo "APK found:"
          ls -lh "$APK_PATH"

          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 2>/dev/null | sort -V | tail -n 1)

          if [ -n "$AAPT2" ]; then
            "$AAPT2" dump badging "$APK_PATH" | head -n 20
          fi

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: project-jarvis-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
